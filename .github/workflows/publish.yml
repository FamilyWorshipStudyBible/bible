# Publishes the Family Worship Bible to GitHub Pages.
# The site is already finished, so nothing is built here: the files are packed up
# in one step and published in a second, with more time allowed than GitHub's usual 10 minutes.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. A newer upload waits for the current one to finish
# instead of cutting it off halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the site's files
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Pack the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          # a fresh name on every attempt, so a re-run never finds two packed copies
          name: github-pages-${{ github.run_attempt }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 2700000
          artifact_name: github-pages-${{ github.run_attempt }}
